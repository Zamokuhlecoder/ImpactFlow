impactflow:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'db') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER') }}"
      password: "{{ env_var('DBT_PASSWORD') }}"
      dbname: "{{ env_var('DBT_DATABASE', 'impactflow') }}"
      schema: "{{ env_var('DBT_SCHEMA', 'analytics') }}"
      threads: 2
      connect_timeout: 10
